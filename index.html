<!DOCTYPE html>
<html lang="en" class="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seoul Industrial Density Analysis</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        glass: {
                            light: 'rgba(255, 255, 255, 0.7)',
                            dark: 'rgba(15, 23, 42, 0.7)'
                        },
                        glassBorder: {
                            light: 'rgba(255, 255, 255, 0.5)',
                            dark: 'rgba(255, 255, 255, 0.1)'
                        }
                    }
                }
            }
        }
    </script>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Leaflet MarkerCluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="font-sans text-gray-800 dark:text-gray-200 antialiased overflow-hidden">

    <!-- Map Container -->
    <div id="map"
        class="w-full h-screen z-0 absolute top-0 left-0 bg-gray-100 dark:bg-gray-900 transition-colors duration-300">
    </div>

    <!-- UI Overlay container to ensure it's above map -->
    <div class="absolute inset-0 pointer-events-none z-10 flex p-4 sm:p-6 pb-20 sm:pb-6">

        <!-- Sidebar -->
        <aside
            class="sidebar-glass w-full sm:w-80 md:w-96 flex flex-col pointer-events-auto h-auto max-h-full rounded-2xl border border-glassBorder-light dark:border-glassBorder-dark shadow-xl backdrop-blur-xl transition-all duration-300 overflow-hidden">

            <!-- Header -->
            <div
                class="p-5 border-b border-gray-200/50 dark:border-gray-700/50 flex justify-between items-center bg-white/30 dark:bg-black/30">
                <div>
                    <h1
                        class="text-xl font-bold bg-gradient-to-r from-blue-600 to-indigo-600 dark:from-blue-400 dark:to-indigo-400 bg-clip-text text-transparent">
                        Seoul WebGIS</h1>
                    <p class="text-xs text-gray-500 dark:text-gray-400 font-medium tracking-wide uppercase mt-1">
                        Industrial Density Analysis</p>
                </div>

                <!-- Theme Toggle Button -->
                <button id="themeToggle"
                    class="p-2 rounded-full hover:bg-gray-200/50 dark:hover:bg-gray-700/50 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500"
                    aria-label="Toggle Theme">
                    <i data-lucide="moon" class="w-5 h-5 text-gray-600 dark:hidden"></i>
                    <i data-lucide="sun" class="w-5 h-5 text-yellow-400 hidden dark:block"></i>
                </button>
            </div>

            <div class="p-5 overflow-y-auto custom-scrollbar flex-grow space-y-6 bg-white/40 dark:bg-gray-900/40">

                <!-- Search -->
                <div class="space-y-2">
                    <label class="text-sm font-semibold flex items-center gap-2">
                        <i data-lucide="search" class="w-4 h-4 text-blue-500"></i>
                        Search Location
                    </label>
                    <div class="relative">
                        <input type="text" id="searchInput" placeholder="Search by name or keyword..."
                            class="w-full bg-white/50 dark:bg-gray-800/50 border border-gray-300/50 dark:border-gray-600/50 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/50 transition-all placeholder-gray-400 dark:placeholder-gray-500">
                        <button id="searchBtn"
                            class="absolute right-2 top-1/2 -translate-y-1/2 p-1.5 bg-blue-500 hover:bg-blue-600 text-white rounded-lg transition-colors">
                            <i data-lucide="arrow-right" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <!-- Filters -->
                <div class="space-y-3">
                    <label class="text-sm font-semibold flex items-center gap-2">
                        <i data-lucide="filter" class="w-4 h-4 text-indigo-500"></i>
                        Industry Categories
                    </label>

                    <div class="space-y-2" id="filterContainer">
                        <!-- Filters populated by JS -->
                        <label
                            class="flex items-center gap-3 p-2 rounded-lg hover:bg-white/50 dark:hover:bg-gray-800/50 transition-colors cursor-pointer border border-transparent hover:border-gray-200/50 dark:hover:border-gray-700/50">
                            <input type="checkbox" value="Manufacturing"
                                class="category-filter w-4 h-4 text-blue-500 rounded border-gray-300 focus:ring-blue-500 dark:border-gray-600 dark:bg-gray-700"
                                checked>
                            <div class="w-3 h-3 rounded-full bg-[#ef4444]"></div>
                            <span class="text-sm font-medium">Manufacturing</span>
                        </label>
                        <label
                            class="flex items-center gap-3 p-2 rounded-lg hover:bg-white/50 dark:hover:bg-gray-800/50 transition-colors cursor-pointer border border-transparent hover:border-gray-200/50 dark:hover:border-gray-700/50">
                            <input type="checkbox" value="Tech"
                                class="category-filter w-4 h-4 text-blue-500 rounded border-gray-300 focus:ring-blue-500 dark:border-gray-600 dark:bg-gray-700"
                                checked>
                            <div class="w-3 h-3 rounded-full bg-[#3b82f6]"></div>
                            <span class="text-sm font-medium">Tech / IT</span>
                        </label>
                        <label
                            class="flex items-center gap-3 p-2 rounded-lg hover:bg-white/50 dark:hover:bg-gray-800/50 transition-colors cursor-pointer border border-transparent hover:border-gray-200/50 dark:hover:border-gray-700/50">
                            <input type="checkbox" value="Logistics"
                                class="category-filter w-4 h-4 text-blue-500 rounded border-gray-300 focus:ring-blue-500 dark:border-gray-600 dark:bg-gray-700"
                                checked>
                            <div class="w-3 h-3 rounded-full bg-[#10b981]"></div>
                            <span class="text-sm font-medium">Logistics</span>
                        </label>
                    </div>
                </div>

                <!-- Info Panel -->
                <div
                    class="bg-blue-50/50 dark:bg-blue-900/20 border border-blue-200/50 dark:border-blue-800/50 rounded-xl p-4">
                    <h3 class="text-sm font-semibold text-blue-800 dark:text-blue-300 flex items-center gap-2 mb-2">
                        <i data-lucide="info" class="w-4 h-4"></i>
                        Proximity Analysis
                    </h3>
                    <p class="text-xs text-blue-700/80 dark:text-blue-300/80 leading-relaxed">
                        Click on any marker to analyze its neighbors within a <span class="font-bold">500m radius</span>
                        using Turf.js spatial operations.
                    </p>
                </div>
            </div>

            <div
                class="p-4 bg-white/30 dark:bg-black/30 border-t border-gray-200/50 dark:border-gray-700/50 text-center">
                <button id="resetViewBtn"
                    class="w-full py-2 px-4 bg-white/50 hover:bg-white/80 dark:bg-gray-800/50 dark:hover:bg-gray-700 text-sm font-medium rounded-lg border border-gray-200/50 dark:border-gray-700 shadow-sm transition-all flex items-center justify-center gap-2">
                    <i data-lucide="map-pin" class="w-4 h-4"></i>
                    Reset Map View
                </button>
            </div>
        </aside>
    </div>

    <!-- Floating Stats/Legend Bottom Right -->
    <div class="absolute bottom-6 right-6 z-10 pointer-events-none hidden sm:block">
        <div
            class="sidebar-glass p-4 rounded-xl border border-glassBorder-light dark:border-glassBorder-dark shadow-xl backdrop-blur-xl bg-white/60 dark:bg-gray-900/60 pointer-events-auto">
            <h4 class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-3">Visible
                Data</h4>
            <div class="flex items-end gap-4">
                <div>
                    <div class="text-2xl font-bold text-gray-800 dark:text-white" id="visibleCount">0</div>
                    <div class="text-xs text-gray-600 dark:text-gray-300">Total Points</div>
                </div>
                <div id="activeRadiusContainer" class="hidden">
                    <div class="h-8 border-l border-gray-300 dark:border-gray-600"></div>
                </div>
                <div id="nearbyCountContainer" class="hidden">
                    <div class="text-2xl font-bold text-blue-600 dark:text-blue-400" id="nearbyCount">0</div>
                    <div class="text-xs text-gray-600 dark:text-gray-300">In 500m Radius</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Leaflet MarkerCluster JS -->
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

    <!-- Turf.js -->
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Application Logic -->
    <script src="app.js"></script>
</body>

</html>
